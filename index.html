<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="card">

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search city...">
      <button onclick="getWeather()">🔍</button>
    </div>

    <div class="weather-box">
      <img id="icon" src="https://cdn-icons-png.flaticon.com/512/869/869869.png">

      <h1 id="temp">--°C</h1>
      <h2 id="city">City Name</h2>

      <div class="extra">
        <div class="info">
          <p>💧 Humidity</p>
          <h3 id="humidity">--%</h3>
        </div>

        <div class="info">
          <p>🌬 Wind</p>
          <h3 id="wind">-- km/h</h3>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
